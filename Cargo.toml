[package]
name = "hyperliquid-arb-bot"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1.42", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Decimal precision for financial calculations
rust_decimal = "1.36"
rust_decimal_macros = "1.36"

# Environment variables
dotenv = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Time handling
chrono = "0.4"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Cryptography for signing
ethers = "2.0"
hex = "0.4"
sha3 = "0.10"

# Concurrent data structures
crossbeam = "0.8"
parking_lot = "0.12"

# Futures
futures = "0.3"
futures-util = "0.3"

# Random number generation (for dry-run simulation)
rand = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
